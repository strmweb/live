<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <!-- Подключаем библиотеку HLS.js для воспроизведения m3u8 потоков -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Адаптивный контейнер: на мобильных занимает весь экран, на ПК выглядит как аккуратное приложение */
        .stream-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 481px) {
            .stream-container {
                height: 95vh;
                max-height: 900px;
                border-radius: 24px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            }
        }

        /* Видео занимает строго верхние 67% экрана устройства, подстраиваясь под любые пропорции */
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 67%; 
            object-fit: contain; /* Сохраняет пропорции видео без искажений */
            background: #000;
        }

        /* Панель чата снизу: занимает ровно 1/3 (33%) экрана на любом устройстве */
        .chat-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 33%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            z-index: 10;
        }

        /* Обертка чата заполняет всю ширину */
        .chat-box {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* Твой встроенный чат Cbox */
        .chat-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="stream-container">
        <!-- Видеопанель управления (адаптирована под размер экрана) -->
        <video id="videoElement" class="video-player" autoplay playsinline controls></video>

        <!-- Чат снизу (33% высоты) -->
        <div class="chat-overlay">
            <div class="chat-box">
                <iframe src="https://www5.cbox.ws/box/?boxid=967024&boxtag=lVnQsO" allowtransparency="yes" allow="autoplay" frameborder="0" marginheight="0" marginwidth="0" scrolling="auto"></iframe>
            </div>
        </div>
    </div>

    <script>
        const videoSource = "https://o12.anwap.be/ohls/LpCRXyzOPrQYvMy9aA105w/1790123606/CHelovek-pauk_Novyj_denq-48515_(anwap.org).m3u8"; 

        const video = document.getElementById('videoElement');
        video.volume = 1.0;

        if (videoSource.endsWith('.m3u8')) {
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSource;
            } else if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSource);
                hls.attachMedia(video);
            }
        } else {
            video.src = videoSource;
        }
    </script>

</body>
</html>
